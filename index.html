<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>领地炮战 TerritoryClash</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #05060a;
      overflow: hidden;
      font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Largest 1080:1260 box that fits the viewport, ratio always preserved.
       dvh handles the mobile browser URL bar; vh lines are fallbacks. */
    #game {
      width: min(100vw, 100vh * 1080 / 1260);
      width: min(100vw, 100dvh * 1080 / 1260);
      height: min(100vh, 100vw * 1260 / 1080);
      height: min(100dvh, 100vw * 1260 / 1080);
      display: block;
      box-shadow: 0 0 60px rgba(60, 120, 255, 0.15);
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      pointer-events: none;
    }
    #overlay.bottom { justify-content: flex-end; padding-bottom: 12%; }
    #overlay.hidden { display: none; }
    #ovTitle {
      color: #eaf2ff;
      font-size: 6vh;
      font-weight: 800;
      letter-spacing: 4px;
      text-shadow: 0 0 24px rgba(91, 214, 255, 0.6);
    }
    #ovSub { color: #9fb0cc; font-size: 2.4vh; letter-spacing: 1px; }
    #actionBtn {
      pointer-events: auto;
      margin-top: 6px;
      padding: 14px 44px;
      font-size: 2.6vh;
      font-weight: 700;
      color: #04203a;
      background: linear-gradient(180deg, #8ee8ff, #1f7cff);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 0 28px rgba(91, 214, 255, 0.7);
      transition: transform 0.08s ease;
    }
    #actionBtn:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="overlay">
      <div id="ovTitle">领地炮战</div>
      <div id="ovSub">霓虹格子领地拉锯 · 自动对战</div>
      <button id="actionBtn">开始</button>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
